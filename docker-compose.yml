version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/dockerfile
      target: dev
    container_name: dashboard
    restart: always
    ports:
      - 3000:3000
      - 24678:24678

  finder-microservice:
    build:
      context: ./apps/finder-microservice
    container_name: finder-microservice
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
    depends_on:
      - rabbitmq

  gateway-microservice:
    build:
      context: ./apps/gateway-microservice
    container_name: gateway-microservice
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
    depends_on:
      - rabbitmq

networks:
  default:
    name: my-network

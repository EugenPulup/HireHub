version: "3.8"

services:
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - ${RABBITMQ_PORT}:5672
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  dashboard:
    env_file: .env
    build:
      context: ./apps/dashboard
      dockerfile: dockerfile
      target: dev
    image: eugenepulup228/dashboard
    container_name: dashboard
    restart: always
    environment:
      - GQL_HOST=http://be-gateway:3000/graphql
      - GQL_ANALYTIC_HOST=http://be-analytic:3000/graphql
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
    ports:
      - ${DASHBOARD_PORT}:3000
      - ${DASHBOARD_TOOLS_PORT}:24678
    depends_on:
      be-gateway:
        condition: service_started

  be-finder:
    env_file: .env
    build:
      context: ./apps/be-finder
      dockerfile: dockerfile
      target: dev
    image: eugenepulup228/be-finder
    container_name: be-finder
    restart: unless-stopped
    ports:
      - "${FINDER_PORT}:3000"
    volumes:
      - ./apps/be-finder:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV}
      KAFKA_URI: kafka:9092
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBITMQ_PORT}
    depends_on:
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"

  be-gateway:
    env_file: .env
    build:
      context: ./apps/be-gateway
      dockerfile: dockerfile
      target: dev
    image: eugenepulup228/be-gateway
    container_name: be-gateway
    restart: unless-stopped
    volumes:
      - ./apps/be-gateway:/app
      - /app/node_modules
    ports:
      - "${GATEWAY_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBITMQ_PORT}
      KAFKA_URI: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresDB:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - kafka
    healthcheck:
      test: curl --fail http://be-gateway:3000
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  be-analytic:
    env_file: .env
    build:
      context: ./apps/be-analytic
      dockerfile: dockerfile
      target: dev
    image: eugenepulup228/be-analytic
    container_name: be-analytic
    restart: unless-stopped
    volumes:
      - ./apps/be-analytic:/app
      - /app/node_modules
    ports:
      - "${ANALITYC_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      KAFKA_URI: kafka:9092
      CLICKHOUSE_HOST: analytic-db
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_USER: admin
      CLICKHOUSE_DB: hireHubTest
    depends_on:
      - kafka

  postgresDB:
    image: postgres:latest
    container_name: postgresDB
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - googieDB-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - ${REDIS_PORT}:6379

  kafka:
    container_name: kafka
    image: bitnami/kafka:latest
    # volumes:
    #   - /data/kafka-persistence:/bitnami/kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - 9092:9092

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - be-gateway
      - be-finder
    # - pgadmin
    # - prometheus
    # - grafana
    # - bull-metrics

  analytic-db:
    image: bitnami/clickhouse:latest
    ports:
      - 9000:9000
      - 8123:8123
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - CLICKHOUSE_ADMIN_PASSWORD=admin
      - CLICKHOUSE_ADMIN_USER=admin

  analytic-db-gui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    ports:
      - 5521:5521
    environment:
      - VITE_CLICKHOUSE_URL=http://analytic-db:8123
      - VITE_CLICKHOUSE_PASS=admin

  # prometheus:
  #   container_name: prometheus
  #   image: bitnami/prometheus:latest
  #   ports:
  #     - ${PROMETHEUS_PORT}:9090
  #   volumes:
  #     - ./prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml

  # grafana:
  #   container_name: grafana
  #   image: grafana/grafana:latest
  #   ports:
  #     - ${GRAFANA_PORT}:3000

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped

  # bull-metrics:
  #   container_name: bull-metrics
  #   image: igrek8/bullmq-prometheus:latest
  #   environment:
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=${REDIS_PORT}
  #     - PROM_PREFIX=jobs
  #   ports:
  #     - ${BULL_METRICS_PORT}:3000
  #   depends_on:
  #     - redis

  # postgres-metrics:
  #   container_name: postgres-metrics
  #   image: prometheuscommunity/postgres-exporter
  #   environment:
  #     - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresDB:5432/${POSTGRES_DB}?sslmode=disable
  #   ports:
  #     - ${POSTGRES_METRICS_PORT}:9187
  #   volumes:
  #     - ./postgres_exporter.yml:/bin/postgres_exporter.yml
  #   depends_on:
  #     - postgresDB

networks:
  default:
    name: my-network

volumes:
  googieDB-data:
  pgadmin-data:

version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: dockerfile
      target: dev
    container_name: dashboard
    restart: always
    ports:
      - 3000:3000
      - 24678:24678

  finder-microservice:
    build:
      context: ./apps/finder-microservice
      dockerfile: dockerfile
      target: dev
    container_name: finder-microservice
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
    depends_on:
      - rabbitmq

  gateway-microservice:
    build:
      context: ./apps/gateway-microservice
      dockerfile: dockerfile
      target: dev
    container_name: gateway-microservice
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      DATABASE_URL: postgresql://googieUser:googiePass@postgresDB:5432/googieDB?schema=public
    depends_on:
      - rabbitmq

  postgresDB:
    image: postgres:latest
    container_name: postgresDB
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "googieDB"
      POSTGRES_USER: "googieUser"
      POSTGRES_PASSWORD: "googiePass"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - googieDB-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U googieUser -d googieDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - postgres
      - default

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    networks:
      - postgres

networks:
  default:
    name: my-network

  postgres:
    driver: bridge

volumes:
  googieDB-data:
  pgadmin-data:

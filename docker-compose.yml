version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - ${RABBITMQ_PORT}:5672
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  dashboard:
    env_file: .env
    build:
      context: ./apps/dashboard
      dockerfile: dockerfile
      target: dev
    container_name: dashboard
    restart: always
    ports:
      - ${DASHBOARD_PORT}:3000
      - ${DASHBOARD_TOOLS_PORT}:24678
    depends_on:
      gateway-microservice:
        condition: service_healthy

  finder-microservice:
    env_file: .env
    build:
      context: ./apps/finder-microservice
      dockerfile: dockerfile
      target: dev
    container_name: finder-microservice
    restart: unless-stopped
    ports:
      - "${FINDER_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBITMQ_PORT}
    depends_on:
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway-microservice:
    env_file: .env
    build:
      context: ./apps/gateway-microservice
      dockerfile: dockerfile
      target: dev
    container_name: gateway-microservice
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBITMQ_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresDB:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - rabbitmq
    healthcheck:
      test: curl --fail http://gateway-microservice:3000
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgresDB:
    image: postgres:latest
    container_name: postgresDB
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - googieDB-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped

  analytic-db:
    container_name: analytic-db
    image: clickhouse/clickhouse-server:latest
    ports:
      - 8123:8123
    environment:
      - CLICKHOUSE_DB=hireHub
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin

  # analytic-db-gui:

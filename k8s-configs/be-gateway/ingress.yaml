# Ingress for Dashboard
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be-gateway-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: gateway.hirehub.loc # Changed to localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be-gateway
                port:
                  number: 3000

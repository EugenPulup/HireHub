global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "be-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway-microservice:3000"]

  - job_name: "be-finder"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["finder-microservice:3000"]

  - job_name: "be-bullmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["bull-metrics:3000"]

  - job_name: "postgresDB"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["postgres-metrics:9187"]
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"
